name: NIST n4 workspace transfer
on:
  pull_request:
    paths:
      - .github/workflows/nist-n4-workspace.yml
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.number == 47 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/nist-2026-n4-experimental-estimator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export committed objects only
        run: |
          git bundle create /tmp/tnp-n4-workspace.bundle HEAD --tags
          git bundle verify /tmp/tnp-n4-workspace.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: tnp-n4-workspace
          path: /tmp/tnp-n4-workspace.bundle
          retention-days: 1
