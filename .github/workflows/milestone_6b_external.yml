name: Milestone 6B external PySR run

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pysr:
    if: github.head_ref == 'codex/milestone-6b-pysr-leakage'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify frozen search source, corrected audit source, and dataset manifest
        run: |
          python - <<'PY'
          import json
          from Discovery.pysr_leakage_check import SOURCE_PATHS as SEARCH_SOURCE_PATHS
          from Discovery.pysr_leakage_check_v2 import (
              SOURCE_PATHS as AUDIT_SOURCE_PATHS,
              build_dataset_manifest,
          )
          from Discovery.pysr_leakage_probe import DATASETS_PATH, canonical_json_bytes
          from Discovery.source_history import repository_root, verify_committed_source_state

          search_source = "f2c26da24cfa5a463dc2bbadeb83c6bf41cc4689"
          audit_source = "201a65f44ac316ae9e0f48235a73f99498848ded"
          verify_committed_source_state(
              repository_root(), search_source,
              source_paths=SEARCH_SOURCE_PATHS,
              artifact_label="Milestone 6B frozen search source",
          )
          verify_committed_source_state(
              repository_root(), audit_source,
              source_paths=AUDIT_SOURCE_PATHS,
              artifact_label="Milestone 6B corrected audit source",
          )
          committed = json.loads(DATASETS_PATH.read_text(encoding="utf-8"))
          expected = build_dataset_manifest()
          if canonical_json_bytes(committed) != canonical_json_bytes(expected):
              raise SystemExit("dataset manifest mismatch")
          print("Frozen search source, corrected audit source, and dataset manifest verified.")
          PY
      - name: Retrieve and pin PySR source
        run: |
          git clone https://github.com/astroautomata/PySR.git /tmp/PySR
          git -C /tmp/PySR checkout --detach 65b887aeaf97f1c5ae84b0ceffb370551e57ce90
          test "$(git -C /tmp/PySR rev-parse HEAD)" = "65b887aeaf97f1c5ae84b0ceffb370551e57ce90"
          test "$(git -C /tmp/PySR rev-parse HEAD:pyproject.toml)" = "8ec704fe5ed95541f70390163c9a6a4d682dc5ea"
          test "$(git -C /tmp/PySR rev-parse HEAD:pysr/juliapkg.json)" = "f4b37052e52c4d1aef7dbfcc950f1cc699e196c1"
          test "$(git -C /tmp/PySR rev-parse HEAD:LICENSE)" = "0223b98bcc92c9bf0ffc6efc2f6054777be1944a"
      - name: Install pinned PySR environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install /tmp/PySR
      - name: Run preregistered target-exposed searches
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import math
          import platform
          import sys
          from pathlib import Path

          import numpy as np
          import pysr
          from pysr import PySRRegressor, jl

          from Discovery.pysr_leakage_probe import (
              CHANNELS,
              CHANNEL_PREDICTORS,
              EXPERIMENT_IDENTIFIER,
              EXTERNAL_PATH,
              PREREGISTRATION_PATH,
              SEEDS,
              build_datasets_record,
              canonical_json_bytes,
              dataset_hashes,
              sha256_bytes,
          )

          prereg = json.loads(PREREGISTRATION_PATH.read_text(encoding="utf-8"))
          datasets = build_datasets_record()
          dataset_sha = sha256_bytes(canonical_json_bytes(datasets))
          if dataset_sha != prereg["dataset_sha256"]:
              raise SystemExit("generated dataset hash differs from preregistration")

          search = prereg["search_configuration"]
          units = prereg["unit_contract"]
          runs = []
          Path("/tmp/pysr-runs").mkdir(parents=True, exist_ok=True)

          for channel in CHANNELS:
              predictors = CHANNEL_PREDICTORS[channel]
              rows = datasets["channels"][channel]
              X = np.asarray(
                  [[float(row[name]) for name in predictors] for row in rows],
                  dtype=np.float64,
              )
              y = np.asarray([float(row["G"]) for row in rows], dtype=np.float64)
              for seed in SEEDS:
                  model = PySRRegressor(
                      niterations=search["niterations"],
                      populations=search["populations"],
                      population_size=search["population_size"],
                      ncycles_per_iteration=search["ncycles_per_iteration"],
                      maxsize=search["maxsize"],
                      binary_operators=search["binary_operators"],
                      unary_operators=search["unary_operators"],
                      precision=search["precision"],
                      deterministic=search["deterministic"],
                      parallelism=search["parallelism"],
                      random_state=seed,
                      dimensional_constraint_penalty=search["dimensional_constraint_penalty"],
                      dimensionless_constants_only=search["dimensionless_constants_only"],
                      model_selection=search["model_selection"],
                      progress=search["progress"],
                      verbosity=search["verbosity"],
                      output_directory=f"/tmp/pysr-runs/{channel}-{seed}",
                  )
                  model.fit(
                      X,
                      y,
                      variable_names=list(predictors),
                      X_units=units[channel]["X_units"],
                      y_units=units[channel]["y_units"],
                  )

                  candidates = []
                  equations = model.equations_
                  for _, row in equations.iterrows():
                      loss = float(row["loss"])
                      if not math.isfinite(loss):
                          continue
                      score_value = row.get("score")
                      score = None
                      if score_value is not None:
                          score_float = float(score_value)
                          if math.isfinite(score_float):
                              score = format(score_float, ".17g")
                      candidates.append(
                          {
                              "equation": str(row["equation"]),
                              "complexity": int(row["complexity"]),
                              "loss": format(loss, ".17g"),
                              "score": score,
                          }
                      )
                  runs.append(
                      {
                          "channel": channel,
                          "seed": seed,
                          "candidate_count": len(candidates),
                          "candidates": candidates,
                      }
                  )

          manifest_text = str(
              jl.seval('read(joinpath(dirname(Base.active_project()), "Manifest.toml"), String)')
          )
          compressed_manifest = gzip.compress(manifest_text.encode("utf-8"), mtime=0)
          symbolic_regression_version = str(
              jl.seval("string(Base.pkgversion(SymbolicRegression))")
          )
          julia_version = str(jl.seval("string(VERSION)"))
          active_project = str(jl.seval("Base.active_project()"))

          record = {
              "schema_version": 1,
              "experiment_identifier": EXPERIMENT_IDENTIFIER,
              "dataset_sha256": dataset_sha,
              "dataset_channel_sha256": dataset_hashes(datasets),
              "external_source": {
                  "repository": "https://github.com/astroautomata/PySR",
                  "pysr_version": str(pysr.__version__),
                  "pysr_commit": "65b887aeaf97f1c5ae84b0ceffb370551e57ce90",
                  "pyproject_blob": "8ec704fe5ed95541f70390163c9a6a4d682dc5ea",
                  "juliapkg_blob": "f4b37052e52c4d1aef7dbfcc950f1cc699e196c1",
                  "license_blob": "0223b98bcc92c9bf0ffc6efc2f6054777be1944a",
              },
              "resolved_environment": {
                  "python_version": sys.version,
                  "platform": platform.platform(),
                  "numpy_version": np.__version__,
                  "julia_version": julia_version,
                  "symbolicregression_version": symbolic_regression_version,
                  "active_project": active_project,
                  "manifest_sha256": hashlib.sha256(manifest_text.encode("utf-8")).hexdigest(),
                  "manifest_gzip_base64": base64.b64encode(compressed_manifest).decode("ascii"),
              },
              "search_configuration": search,
              "runs": runs,
          }
          EXTERNAL_PATH.parent.mkdir(parents=True, exist_ok=True)
          EXTERNAL_PATH.write_bytes(canonical_json_bytes(record))
          print(f"Wrote {EXTERNAL_PATH} with {sum(r['candidate_count'] for r in runs)} candidates.")
          PY
      - name: Upload raw external evidence even if normalization fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-6b-pysr-raw
          path: Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.external.json
          if-no-files-found: error
      - name: Normalize and verify evidence without trusting PySR classifications
        run: |
          python -m Discovery.pysr_leakage_check_v2 --write-result --source-commit-sha 201a65f44ac316ae9e0f48235a73f99498848ded
          python -m Discovery.pysr_leakage_check_v2 --check
      - name: Upload normalized result
        uses: actions/upload-artifact@v4
        with:
          name: milestone-6b-pysr-result
          path: Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.result.json
          if-no-files-found: error
