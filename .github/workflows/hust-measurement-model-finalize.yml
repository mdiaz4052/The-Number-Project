name: Finalize HUST MeasurementModel artifact

on:
  push:
    branches:
      - codex/hust-2018-aaf-measurement-models

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/codex/hust-2018-aaf-measurement-models'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hust-2018-aaf-measurement-models
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Canonicalize Decimal evaluation order
        run: |
          python - <<'PY'
          from pathlib import Path
          module = Path("Discovery/hust_2018_aaf_measurement_models.py")
          text = module.read_text(encoding="utf-8")
          replacements = (
              ('        g_hat = alpha_si * correction_factor / p_sum\n',
               '        g_hat = alpha_si / p_sum * correction_factor\n'),
              ('        expected_g = expected_alpha_si * expected_correction / p_sum\n',
               '        expected_g = expected_alpha_si / p_sum * expected_correction\n'),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one canonicalization target: {old!r}")
              text = text.replace(old, new, 1)
          module.write_text(text, encoding="utf-8")
          PY
      - name: Prove focused model and workflow-safety behavior
        run: python -m unittest tests.test_hust_2018_aaf_measurement_models tests.test_workflow_write_safety -v
      - name: Generate deterministic empirical artifact
        run: python -m Discovery.hust_2018_aaf_measurement_models
      - name: Verify generated artifact
        run: python -m Discovery.hust_2018_aaf_measurement_models --check
      - name: Check diff hygiene before local commit
        run: git diff --check
      - name: Create clean local data/model commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Discovery/hust_2018_aaf_measurement_models.py \
                  Experiments/GMeasurements/hust_2018_aaf_measurement_models_v1.json
          git commit -m "Finalize HUST AAF empirical MeasurementModel artifact"
          test -z "$(git status --porcelain)"
      - name: Run full Python suite from clean committed state
        run: python -m unittest discover -s tests -v
      - name: Run all existing permanent Python guards from clean committed state
        run: |
          python -m Discovery.dimensional_search --check
          python -m Discovery.inverse_square_search --check
          python -m Discovery.dependency_analysis --check
          python -m Discovery.physical_bridge --check
          python -m Discovery.published_data_pilot --check
          python -m Discovery.hust_2018_aaf_source_audit --check
          python -m Discovery.hust_2018_aaf_measurement_models --check
          python -m Discovery.falsification_preregistration --check
          python -m Discovery.null_experiments --check
          python -m Discovery.mutation_harness --check
          python -m Discovery.pydimension_comparison --check
          python -m Discovery.pysr_leakage_check_v2 --check
          python -m Discovery.pysr_leakage_mutations --check
          python -m Discovery.pysr_leakage_hardening --check
          python -m Discovery.pysr_leakage_hardening_mutations --check
      - name: Push model and artifact only after all checks pass
        run: git push origin HEAD:codex/hust-2018-aaf-measurement-models
