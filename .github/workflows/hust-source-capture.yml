name: Temporary HUST source capture

on:
  push:
    branches: [codex/hust-2018-aaf-source-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture publisher listing and supplementary bytes
        run: |
          python - <<'PY'
          from __future__ import annotations
          from urllib.request import Request, urlopen
          import hashlib
          import json
          from pathlib import Path

          ARTICLE_URL = 'https://www.nature.com/articles/s41586-018-0431-5'
          MEDIA_BASE = 'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41586-018-0431-5/MediaObjects/'
          RETRIEVAL_DATE = '2026-09-03'
          OUTPUT = Path('Experiments/GMeasurements/hust_2018_aaf_external_sources_v1.json')
          RESOURCE_SPECS = [
              ('supplementary_information', 'Supplementary Information', '41586_2018_431_MOESM1_ESM.pdf'),
              ('supplementary_data', 'Supplementary Data', '41586_2018_431_MOESM2_ESM.xlsx'),
              ('source_data_fig_2', 'Source Data Fig. 2', '41586_2018_431_MOESM3_ESM.xlsx'),
              ('source_data_fig_3', 'Source Data Fig. 3', '41586_2018_431_MOESM4_ESM.xlsx'),
              ('source_data_extended_fig_2', 'Source Data Extended Data Fig. 2', '41586_2018_431_MOESM5_ESM.xlsx'),
              ('source_data_extended_fig_4', 'Source Data Extended Data Fig. 4', '41586_2018_431_MOESM6_ESM.xlsx'),
              ('source_data_extended_fig_5', 'Source Data Extended Data Fig. 5', '41586_2018_431_MOESM7_ESM.xlsx'),
          ]

          def fetch(url: str) -> tuple[bytes, str, str | None]:
              request = Request(url, headers={'User-Agent': 'Mozilla/5.0 The-Number-Project-source-audit'})
              with urlopen(request, timeout=60) as response:
                  return response.read(), response.geturl(), response.headers.get_content_type()

          article_bytes, article_resolved, article_type = fetch(ARTICLE_URL)
          resources = []
          for source_id, label, filename in RESOURCE_SPECS:
              url = MEDIA_BASE + filename
              content, resolved, content_type = fetch(url)
              resources.append({
                  'source_id': source_id,
                  'label': label,
                  'offered_url': url,
                  'resolved_url': resolved,
                  'retrieval_date': RETRIEVAL_DATE,
                  'content_type': content_type,
                  'byte_length': len(content),
                  'sha256': hashlib.sha256(content).hexdigest(),
                  'retrieval_status': 'retrieved',
              })

          record = {
              'schema_version': 1,
              'article': {
                  'source_id': 'nature_article_listing',
                  'label': 'Nature version-of-record landing page and supplementary resource listing',
                  'offered_url': ARTICLE_URL,
                  'resolved_url': article_resolved,
                  'retrieval_date': RETRIEVAL_DATE,
                  'content_type': article_type,
                  'byte_length': len(article_bytes),
                  'sha256': hashlib.sha256(article_bytes).hexdigest(),
                  'retrieval_status': 'retrieved',
              },
              'resources': sorted(resources, key=lambda row: row['source_id']),
              'capture_method': 'Publisher media endpoints were matched to the Nature listing order verified during preregistration review.',
              'capture_nonclaim': 'Hashes record bytes retrieved on the stated date; CI does not re-fetch mutable external resources.',
          }
          OUTPUT.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(OUTPUT)
          print('article', len(article_bytes), hashlib.sha256(article_bytes).hexdigest(), article_resolved)
          for row in record['resources']:
              print(row['source_id'], row['content_type'], row['byte_length'], row['sha256'], row['resolved_url'])
          PY
      - name: Commit source-capture artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Experiments/GMeasurements/hust_2018_aaf_external_sources_v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Capture HUST 2018 public source bytes'
          git push
