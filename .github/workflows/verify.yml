name: Verify

on:
  push:
    branches: [codex/milestone-6b-pysr-leakage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup_6b:
    name: Finalize Milestone 6B review package
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/milestone-6b-pysr-leakage') || (github.event_name == 'pull_request' && github.head_ref == 'codex/milestone-6b-pysr-leakage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/milestone-6b-pysr-leakage
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify committed evidence
        run: |
          set -euo pipefail
          python -m Discovery.pysr_leakage_check_v2 --check
          python -m Discovery.pysr_leakage_mutations --check
      - name: Update permanent documentation and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          milestone_anchor = (
              'input set. The repository records the missing evidence rather than back-solving it from\n'
              'the published value. No empirical result or replication claim is created.\n'
          )
          milestone_text = (
              '\nMilestone 6B uses a pinned PySR 2.2.0 run on preregistered synthetic controls to test a\n'
              'specific provenance boundary. Its primary methodological result is `BOUNDARY_CONFIRMED`:\n'
              'a candidate can be dimensionally valid and have no registered algebraic path to `G` while\n'
              'still carrying known target information through the data-generation path. All 26 PySR\n'
              'outputs are permanently `target_exposed_candidate` and promotion-ineligible; 17 also fail\n'
              'the project\'s independent dimensional check. This is a software/methodology result, not\n'
              'evidence about gravity or a measurement of `G`.\n'
          )
          if 'Milestone 6B uses a pinned PySR 2.2.0 run' not in text:
              if milestone_anchor not in text:
                  raise SystemExit('README milestone anchor missing')
              text = text.replace(milestone_anchor, milestone_anchor + milestone_text, 1)

          output_anchor = (
              '- `Experiments/Falsification/` records the immutable 5B-core preregistration, complete\n'
              '  provenance-stratified null and planted-control result, and disposable-worktree mutation\n'
              '  result with source and integrity metadata.\n'
          )
          output_text = (
              '- `Experiments/EcosystemComparison/PySRLeakage/` records the frozen 6B preregistration,\n'
              '  deterministic dataset manifest, raw pinned PySR output, independently normalized v2 audit,\n'
              '  and two killed semantic mutations for target exposure and hidden-generation leakage.\n'
          )
          if '`Experiments/EcosystemComparison/PySRLeakage/` records' not in text:
              if output_anchor not in text:
                  raise SystemExit('README output anchor missing')
              text = text.replace(output_anchor, output_anchor + output_text, 1)

          label_anchor = '| **Conjecture** | A precise proposed relationship for which no proof is currently supplied. |\n'
          label_text = '| **Target-exposed candidate** | A candidate proposed or generated after the target or target-bearing data were available to the generating process. It may motivate a new target-clean preregistered path, but the original candidate is not promotion-eligible. |\n'
          if '**Target-exposed candidate**' not in text:
              if label_anchor not in text:
                  raise SystemExit('README epistemic-label anchor missing')
              text = text.replace(label_anchor, label_anchor + label_text, 1)
          readme.write_text(text, encoding='utf-8')

          for path in (
              Path('.github/workflows/milestone_6b_external.yml'),
              Path('.github/workflows/milestone_6b_mutations.yml'),
              Path('.github/workflows/milestone_6b_finalize.yml'),
          ):
              if path.exists():
                  path.unlink()
          PY
          python -m Discovery.pysr_leakage_check_v2 --check
          python -m Discovery.pysr_leakage_mutations --check
          git diff --check
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finalize Milestone 6B review package"
          git push origin HEAD:codex/milestone-6b-pysr-leakage
