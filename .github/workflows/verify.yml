name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lean:
    name: Lean build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1.6.0
        with:
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          axiom-audit: true
        env:
          LEAN_NUM_THREADS: 1

  python:
    name: Python tests and bounded search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/bipm-2014-correlated-estimator
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m Discovery.bipm_2014_correlated_estimator --output Experiments/GMeasurements/bipm_2014_correlated_estimator_v1.json
      - run: python -m Discovery.bipm_2014_correlated_estimator_mutations --output Experiments/GMeasurements/bipm_2014_correlated_estimator_mutations_v1.json
      - run: python -m unittest tests.test_bipm_2014_correlated_estimator tests.test_bipm_2014_correlated_estimator_mutations -v
      - run: git diff --check
      - name: Commit deterministic BIPM evidence
        run: |
          if [ -z "$(git status --porcelain -- Experiments/GMeasurements/bipm_2014_correlated_estimator_v1.json Experiments/GMeasurements/bipm_2014_correlated_estimator_mutations_v1.json)" ]; then
            echo "BIPM evidence already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Experiments/GMeasurements/bipm_2014_correlated_estimator_v1.json Experiments/GMeasurements/bipm_2014_correlated_estimator_mutations_v1.json
            git commit -m "Commit deterministic BIPM correlated estimator evidence"
            git push origin HEAD:codex/bipm-2014-correlated-estimator
          fi
