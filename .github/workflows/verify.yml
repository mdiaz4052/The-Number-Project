name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1.6.0
        with:
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          axiom-audit: true
        env:
          LEAN_NUM_THREADS: 1

  python:
    name: Python tests and bounded search
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/nist-2026-n4-experimental-estimator' && github.repository == 'mdiaz4052/The-Number-Project'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/nist-2026-n4-experimental-estimator
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Regenerate and commit only the deterministic n=4 artifact
        run: |
          set -euo pipefail
          path='Experiments/GMeasurements/nist_2026_n4_experimental_estimator_v1.json'
          python -m Discovery.nist_2026_n4_experimental_estimator --output "$path"
          python -m unittest tests.test_nist_2026_n4_experimental_estimator.NIST2026N4EstimatorBehaviorTests -v
          python -m unittest tests.test_nist_2026_n4_experimental_estimator.NIST2026N4EstimatorArtifactTests.test_preregistration_anchor_and_read_closure_prerequisite_chronology tests.test_nist_2026_n4_experimental_estimator.NIST2026N4EstimatorArtifactTests.test_source_inventory_is_bounded_and_nist_scoped tests.test_nist_2026_n4_experimental_estimator.NIST2026N4EstimatorArtifactTests.test_committed_artifact_matches_rebuild -v
          git diff --check
          if git diff --quiet -- "$path"; then
            echo 'deterministic artifact already exact'
            exit 0
          fi
          changed="$(git status --porcelain)"
          test "$changed" = " M $path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'Refresh deterministic NIST n=4 estimator artifact'
          git push origin HEAD:codex/nist-2026-n4-experimental-estimator
