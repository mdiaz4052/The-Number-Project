name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1.6.0
        with:
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          axiom-audit: true
        env:
          LEAN_NUM_THREADS: 1

  python:
    name: Python tests and bounded search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m Discovery.dimensional_search --check
      - run: python -m Discovery.inverse_square_search --check
      - run: python -m Discovery.dependency_analysis --check
      - run: python -m Discovery.physical_bridge --check
      - run: python -m Discovery.published_data_pilot --check
      - run: python -m Discovery.hust_2018_aaf_source_audit --check
      # Keep the three authorized HUST depth-2a empirical central-value records current.
      - run: python -m Discovery.hust_2018_aaf_measurement_models --check
      # Keep the separately authorized HUST depth-2b uncertainty records current.
      - run: python -m Discovery.hust_2018_aaf_depth_2b_authorization --check
      - run: python -m Discovery.hust_2018_aaf_depth_2b_measurement_models --check
      - run: python -m Discovery.hust_2018_aaf_depth_2b_mutations --check
      - run: python -m Discovery.falsification_preregistration --check
      - run: python -m Discovery.null_experiments --check
      - run: python -m Discovery.mutation_harness --check
      - run: python -m Discovery.pydimension_comparison --check
      - run: python -m Discovery.pysr_leakage_check_v2 --check
      - run: python -m Discovery.pysr_leakage_mutations --check
      - run: python -m Discovery.pysr_leakage_hardening --check
      - run: python -m Discovery.pysr_leakage_hardening_mutations --check
