name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  lean:
    name: Lean build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1.6.0
        with:
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          axiom-audit: true
        env:
          LEAN_NUM_THREADS: 1

  python:
    name: Python tests and bounded search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m Discovery.dimensional_search --check
      - run: python -m Discovery.inverse_square_search --check
      - run: python -m Discovery.dependency_analysis --check
      - run: python -m Discovery.physical_bridge --check
      - run: python -m Discovery.published_data_pilot --check
      - run: python -m Discovery.falsification_preregistration --check
      - run: python -m Discovery.null_experiments --check
      - run: python -m Discovery.mutation_harness --check
      - run: python -m Discovery.pydimension_comparison --check

  finalize_6b:
    name: Finalize Milestone 6B evidence package
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/milestone-6b-pysr-leakage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Import exact reviewed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/6b/raw /tmp/6b/result /tmp/6b/mutation
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9861736005/zip" -o /tmp/6b/raw.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9861737008/zip" -o /tmp/6b/result.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9861673360/zip" -o /tmp/6b/mutation.zip
          unzip -q /tmp/6b/raw.zip -d /tmp/6b/raw
          unzip -q /tmp/6b/result.zip -d /tmp/6b/result
          unzip -q /tmp/6b/mutation.zip -d /tmp/6b/mutation
          cp /tmp/6b/raw/milestone_6b_pysr_leakage_v1.external.json Experiments/EcosystemComparison/PySRLeakage/
          cp /tmp/6b/result/milestone_6b_pysr_leakage_v1.result.json Experiments/EcosystemComparison/PySRLeakage/
          cp /tmp/6b/mutation/milestone_6b_pysr_leakage_v1.mutation_results.json Experiments/EcosystemComparison/PySRLeakage/
          echo "5dc9ceae6d49a8bfab8f00fc4e0d4ddba8c3a4b31bfe4b0944a65aa4c5cf5176  Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.external.json" | sha256sum --check --strict
          echo "ed01adff58bc6b95b1d6281af92b3d97a1f71757da760a36762a2bde8fb654a4  Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.result.json" | sha256sum --check --strict
          echo "44ab9598fe07c56091f7ebd27266e7d89a553aa370c144c2744b858df7e94015  Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.mutation_results.json" | sha256sum --check --strict
      - name: Finalize documentation and permanent CI
        run: |
          python - <<'PY'
          from pathlib import Path

          permanent_verify = '''name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1.6.0
        with:
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          axiom-audit: true
        env:
          LEAN_NUM_THREADS: 1

  python:
    name: Python tests and bounded search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m Discovery.dimensional_search --check
      - run: python -m Discovery.inverse_square_search --check
      - run: python -m Discovery.dependency_analysis --check
      - run: python -m Discovery.physical_bridge --check
      - run: python -m Discovery.published_data_pilot --check
      - run: python -m Discovery.falsification_preregistration --check
      - run: python -m Discovery.null_experiments --check
      - run: python -m Discovery.mutation_harness --check
      - run: python -m Discovery.pydimension_comparison --check
      - run: python -m Discovery.pysr_leakage_check --check
      - run: python -m Discovery.pysr_leakage_mutations --check
'''
          Path('.github/workflows/verify.yml').write_text(permanent_verify, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          milestone_anchor = 'input set. The repository records the missing evidence rather than back-solving it from\nthe published value. No empirical result or replication claim is created.\n'
          milestone_text = '\nMilestone 6B uses a pinned PySR 2.2.0 run on preregistered synthetic controls to test a\nspecific provenance boundary. Its primary methodological result is `BOUNDARY_CONFIRMED`:\na candidate can be dimensionally valid and have no registered algebraic path to `G` while\nstill carrying known target information through the data-generation path. All 26 PySR\noutputs are permanently `target_exposed_candidate` and promotion-ineligible; 17 also fail\nthe project\'s independent dimensional check. This is a software/methodology result, not\nevidence about gravity or a measurement of `G`.\n'
          if 'Milestone 6B uses a pinned PySR 2.2.0 run' not in text:
              if milestone_anchor not in text:
                  raise SystemExit('README milestone insertion anchor missing')
              text = text.replace(milestone_anchor, milestone_anchor + milestone_text, 1)
          output_anchor = '- `Experiments/Falsification/` records the immutable 5B-core preregistration, complete\n  provenance-stratified null and planted-control result, and disposable-worktree mutation\n  result with source and integrity metadata.\n'
          output_text = '- `Experiments/EcosystemComparison/PySRLeakage/` records the frozen 6B preregistration,\n  deterministic dataset manifest, raw pinned PySR output, independently normalized audit,\n  and two killed semantic mutations for target-exposure and hidden-generation leakage.\n'
          if '`Experiments/EcosystemComparison/PySRLeakage/` records' not in text:
              if output_anchor not in text:
                  raise SystemExit('README output insertion anchor missing')
              text = text.replace(output_anchor, output_anchor + output_text, 1)
          label_anchor = '| **Conjecture** | A precise proposed relationship for which no proof is currently supplied. |\n'
          label_text = '| **Target-exposed candidate** | A candidate proposed or generated after the target or target-bearing data were available to the generating process. It may motivate a new target-clean preregistered path, but the original candidate is not promotion-eligible. |\n'
          if '**Target-exposed candidate**' not in text:
              if label_anchor not in text:
                  raise SystemExit('README epistemic-label insertion anchor missing')
              text = text.replace(label_anchor, label_anchor + label_text, 1)
          readme.write_text(text, encoding='utf-8')

          Path('Experiments/EcosystemComparison/PySRLeakage/README.md').write_text('''# Milestone 6B — PySR target-leakage probe

This experiment tests a boundary of the project's provenance machinery using synthetic data only.

The central distinction is between candidate origin, registered algebraic ancestry, and known synthetic generation ancestry. PySR saw the target, so every emitted expression is a `target_exposed_candidate`; registered dependency asks whether exact registered definitions expand to a nonzero power of `G`; the separate synthetic DAG records whether a predictor was actually generated from the target.

## Preregistered channels

- `A_clean`: `u_clean` and `r_clean` are upstream of `G = u_clean / r_clean`.
- `B_registered_leak`: `m_P = sqrt(hbar * c / G)` uses the registered Planck-mass dependency.
- `C_hidden_leak`: `k_hidden = G * s_hidden`, while `k_hidden` is deliberately registered as atomic.

## Result

The primary methodological endpoint is **`BOUNDARY_CONFIRMED`**. The Channel C canonical control `k_hidden / s_hidden` is dimensionally valid, has `no_registered_target_path`, and has known target ancestry in the synthetic generation graph. Registered algebraic dependency tracing therefore cannot by itself establish calibration, statistical, experimental, causal, or physical independence.

The frozen PySR experiment used seeds `0`, `1`, and `2` on all three channels and produced 26 finite candidates. The independent audit classified 9 as dimensionally valid, 17 as dimensionally invalid, 20 as normalized monomials, 6 as representational gaps, 4 as having registered target paths, 16 as using predictors with known target-generation leakage, and 6 as hidden-target-leakage blind spots. There were no parse failures.

PySR recovered the canonical signature in `A_clean` and `C_hidden_leak`, but not in `B_registered_leak`. That non-recovery was allowed by the preregistration and was not followed by search-budget or operator tuning. In Channel C, every seed emitted both `k_hidden` and `k_hidden / s_hidden`; all six are dimensionally valid, have no registered algebraic target path, and reference a predictor known by construction to be downstream of `G`.

Every PySR expression remains permanently `target_exposed_candidate` and promotion-ineligible. It may motivate a new target-clean preregistered investigation, but the original record cannot be relabeled into stronger evidence.

Two selected semantic mutations were killed in the existing disposable-worktree harness: one attempted to bypass the target-exposed promotion valve, and one collapsed generation-DAG leakage into the registered algebraic result, erasing the Channel C distinction.

## Provenance and reproducibility

The external source is pinned to PySR 2.2.0 commit `65b887aeaf97f1c5ae84b0ceffb370551e57ce90`. The run resolved SymbolicRegression.jl 2.2.0 on Julia 1.11.9 and records the complete resolved Julia manifest in the raw artifact. Ordinary CI does not import or rerun PySR.

Evidence SHA-256 values:

- raw external artifact: `5dc9ceae6d49a8bfab8f00fc4e0d4ddba8c3a4b31bfe4b0944a65aa4c5cf5176`;
- normalized result: `ed01adff58bc6b95b1d6281af92b3d97a1f71757da760a36762a2bde8fb654a4`;
- mutation result: `44ab9598fe07c56091f7ebd27266e7d89a553aa370c144c2744b858df7e94015`.

The preregistration was committed at `a3cc025bf41670e37b1f85583205156eea1db2b0`; search-driving source was frozen at `f2c26da24cfa5a463dc2bbadeb83c6bf41cc4689`; the normalized result records corrected audit source `201a65f44ac316ae9e0f48235a73f99498848ded`; and the selected mutation result records source anchor `182e2f3e6129f3a1ffff4890437b8e56119c6575`.

## Execution note

The first frozen search completed with 26 candidates, but the initial normalization step failed on a constant-only expression. Numeric constants were already permitted by the preregistered grammar; the adapter incorrectly passed an empty factor signature into an older helper that rejects empty signatures. The correction explicitly handles a constant-only monomial as dimensionless with no registered target path and adds a regression test. No dataset, seed, operator, unit setting, search budget, or acceptance criterion changed after observing the output. The corrected run uploads raw evidence before normalization so a project-side audit failure cannot discard the external record.

## Nonclaims

This is not a measurement of `G`, evidence for gravity, or independent confirmation of a PySR expression. PySR's dimensional penalty is not a project acceptance rule. Repeated recovery does not remove target exposure. The synthetic generation graph is known by construction and is not a general causal-inference method. Two killed mutants do not establish that the machinery is defect-free.
''', encoding='utf-8')

          for path in (
              Path('.github/workflows/milestone_6b_external.yml'),
              Path('.github/workflows/milestone_6b_mutations.yml'),
              Path('.github/workflows/milestone_6b_finalize.yml'),
          ):
              if path.exists():
                  path.unlink()
          PY
      - name: Validate and commit final package
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m Discovery.pysr_leakage_check --check
          python -m Discovery.pysr_leakage_mutations --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finalize Milestone 6B evidence and guards"
          git push origin HEAD:codex/milestone-6b-pysr-leakage
