name: Verify

on:
  pull_request:

permissions:
  contents: write

jobs:
  p4_finalize:
    name: Apply P4 metadata form validation
    if: github.event.pull_request.head.ref == 'codex/p4-metadata-form-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/p4-metadata-form-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Patch schema, tests, and documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          schema_path = Path('Discovery/physical_bridge_schema.py')
          schema = schema_path.read_text(encoding='utf-8')

          old_imports = '''from dataclasses import dataclass
          from decimal import Decimal
          from fractions import Fraction
          from pathlib import Path
          from types import MappingProxyType
          from typing import Any, Iterable, Mapping
          '''
          new_imports = '''from dataclasses import dataclass
          from datetime import date
          from decimal import Decimal
          from fractions import Fraction
          from pathlib import Path
          import re
          from types import MappingProxyType
          from typing import Any, Iterable, Mapping
          from urllib.parse import urlsplit
          '''
          assert schema.count(old_imports) == 1
          schema = schema.replace(old_imports, new_imports)

          old_require = '''def _require_text(value: object, label: str) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise BridgeValidationError(f"{label} must be a nonempty string")
              return value


          def _unique_text(values: Iterable[str], label: str) -> tuple[str, ...]:
          '''
          new_require = '''def _require_text(value: object, label: str) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise BridgeValidationError(f"{label} must be a nonempty string")
              return value


          _ACCESS_DATE_RE = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}$", re.ASCII)
          _DOI_RE = re.compile(r"^10\\.[0-9]{4,9}/\\S+$", re.ASCII)
          _CERTIFICATE_ID_RE = re.compile(
              r"^[A-Za-z0-9][A-Za-z0-9._:/+\\-]*$",
              re.ASCII,
          )
          _SOURCE_IDENTIFIER_PREFIXES = ("doi", "url", "certificate")


          def _validate_access_date(value: object, label: str) -> str:
              text = _require_text(value, label)
              if text != text.strip() or _ACCESS_DATE_RE.fullmatch(text) is None:
                  raise BridgeValidationError(
                      f"{label} must be a strict ISO calendar date in YYYY-MM-DD form"
                  )
              try:
                  date.fromisoformat(text)
              except ValueError as error:
                  raise BridgeValidationError(
                      f"{label} must be a valid calendar date in YYYY-MM-DD form"
                  ) from error
              return text


          def _validate_source_identifier(value: object, label: str) -> str:
              text = _require_text(value, label)
              if text != text.strip() or any(character.isspace() for character in text):
                  raise BridgeValidationError(
                      f"{label} cannot contain whitespace or outer padding"
                  )
              prefix, separator, payload = text.partition(":")
              if not separator or prefix not in _SOURCE_IDENTIFIER_PREFIXES:
                  raise BridgeValidationError(
                      f"{label} must use one of the explicit prefixes: "
                      "doi:, url:, certificate:"
                  )
              if prefix == "doi":
                  if _DOI_RE.fullmatch(payload) is None:
                      raise BridgeValidationError(
                          f"{label} has a malformed DOI; expected doi:10.<registrant>/<suffix>"
                      )
              elif prefix == "url":
                  parsed = urlsplit(payload)
                  if (
                      parsed.scheme != "https"
                      or not parsed.netloc
                      or parsed.username is not None
                      or parsed.password is not None
                  ):
                      raise BridgeValidationError(
                          f"{label} URL must be an absolute credential-free https URL"
                      )
              elif _CERTIFICATE_ID_RE.fullmatch(payload) is None:
                  raise BridgeValidationError(
                      f"{label} certificate token is malformed"
                  )
              return text


          def _unique_text(values: Iterable[str], label: str) -> tuple[str, ...]:
          '''
          assert schema.count(old_require) == 1
          schema = schema.replace(old_require, new_require)

          old_metadata = '''        for value, label in (
                      (self.source_identifier, f"source identifier for {self.identifier}"),
                      (self.edition, f"edition for {self.identifier}"),
                      (self.access_date, f"access date for {self.identifier}"),
                  ):
                      if value is not None:
                          _require_text(value, label)
          '''
          new_metadata = '''        if self.source_identifier is not None:
                      _validate_source_identifier(
                          self.source_identifier,
                          f"source identifier for {self.identifier}",
                      )
                  if self.edition is not None:
                      _require_text(self.edition, f"edition for {self.identifier}")
                  if self.access_date is not None:
                      _validate_access_date(
                          self.access_date,
                          f"access date for {self.identifier}",
                      )
          '''
          assert schema.count(old_metadata) == 1
          schema = schema.replace(old_metadata, new_metadata)
          schema_path.write_text(schema, encoding='utf-8')

          tests = textwrap.dedent('''
              from dataclasses import replace
              import unittest

              from Discovery.physical_bridge import (
                  BridgeValidationError,
                  build_inverse_square_model,
              )


              def codata_reference():
                  model = build_inverse_square_model()
                  return next(
                      quantity
                      for quantity in model.quantities
                      if quantity.identifier == "codata_2022_G"
                  )


              class PhysicalBridgeMetadataFormTests(unittest.TestCase):
                  def test_access_date_requires_strict_iso_calendar_form(self) -> None:
                      reference = codata_reference()
                      invalid = (
                          "zzz",
                          "2026-9-01",
                          "20260901",
                          "2026-W36-2",
                          "2026-02-30",
                          "2026-13-01",
                          " 2026-09-01",
                      )
                      for value in invalid:
                          with self.subTest(value=value):
                              with self.assertRaisesRegex(
                                  BridgeValidationError,
                                  "access date.*YYYY-MM-DD",
                              ):
                                  replace(reference, access_date=value)

                  def test_valid_calendar_dates_are_accepted(self) -> None:
                      reference = codata_reference()
                      self.assertEqual(
                          replace(reference, access_date="2024-02-29").access_date,
                          "2024-02-29",
                      )
                      self.assertEqual(
                          replace(reference, access_date="2026-09-02").access_date,
                          "2026-09-02",
                      )

                  def test_source_identifier_requires_explicit_supported_prefix(self) -> None:
                      reference = codata_reference()
                      invalid = (
                          "zzz",
                          "ftp:example.org/data",
                          "DOI:10.1063/5.0279860",
                          "doi:zzz",
                          "doi:10.12/example",
                          "doi:10.1234/",
                          "url:http://example.org/data",
                          "url:https://",
                          "certificate:",
                          "certificate:has whitespace",
                      )
                      for value in invalid:
                          with self.subTest(value=value):
                              with self.assertRaisesRegex(
                                  BridgeValidationError,
                                  "source identifier",
                              ):
                                  replace(reference, source_identifier=value)

                  def test_supported_source_identifier_forms_are_accepted(self) -> None:
                      reference = codata_reference()
                      valid = (
                          "doi:10.1063/5.0279860",
                          "doi:10.59161/JCGM200-2012",
                          "url:https://example.org/data/v1?edition=2#table-3",
                          "certificate:force-reference",
                          "certificate:lab-A/run_2026-09-02",
                      )
                      for value in valid:
                          with self.subTest(value=value):
                              self.assertEqual(
                                  replace(reference, source_identifier=value).source_identifier,
                                  value,
                              )

                  def test_edition_remains_descriptive_nonempty_text(self) -> None:
                      reference = codata_reference()
                      descriptive = "2022 CODATA adjustment, published 2025"
                      self.assertEqual(
                          replace(reference, edition=descriptive).edition,
                          descriptive,
                      )
                      with self.assertRaisesRegex(
                          BridgeValidationError,
                          "edition.*nonempty",
                      ):
                          replace(reference, edition="   ")


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path('tests/test_physical_bridge_metadata_forms.py').write_text(tests, encoding='utf-8')

          readme_path = Path('Experiments/GMeasurements/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_readme = '''For any future `empirical_record`, every populated numerical quantity in estimator
          ancestry, and every declared calibration or correction, must declare documented
          provenance plus a source identifier, edition, and access date. This makes absent source
          metadata fail closed. It does not prove that a cited value was experimentally independent
          or protect against a knowing editor who fabricates a plausible citation; source auditing
          remains an evidence task.
          '''
          new_readme = '''For any future `empirical_record`, every populated numerical quantity in estimator
          ancestry, and every declared calibration or correction, must declare documented
          provenance plus a source identifier, edition, and access date. Source metadata is also
          form-validated at `QuantityRecord` construction: access dates must be valid calendar dates
          in strict `YYYY-MM-DD` form, and source identifiers must use an explicit `doi:`,
          `url:https://...`, or `certificate:` form. Edition remains descriptive nonempty text.
          This makes absent or syntactically malformed source metadata fail closed. It does not prove
          that a cited value was experimentally independent, that a syntactically valid identifier
          resolves to the claimed evidence, or that an editor did not fabricate a plausible citation;
          source auditing remains an evidence task.
          '''
          old_readme = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_readme.splitlines()) + '\n'
          new_readme = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_readme.splitlines()) + '\n'
          assert readme.count(old_readme) == 1
          readme_path.write_text(readme.replace(old_readme, new_readme), encoding='utf-8')
          PY
      - name: Run focused P4 checks
        run: |
          python -m unittest tests.test_physical_bridge_metadata_forms -v
          python -m Discovery.physical_bridge --check
          python -m Discovery.mutation_harness --check
      - name: Restore permanent Verify workflow and commit P4
        run: |
          git checkout origin/main -- .github/workflows/verify.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Discovery/physical_bridge_schema.py tests/test_physical_bridge_metadata_forms.py Experiments/GMeasurements/README.md .github/workflows/verify.yml
          git commit -m "Validate empirical source metadata forms"
          git push origin HEAD:codex/p4-metadata-form-validation
