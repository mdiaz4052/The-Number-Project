name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1.6.0
        with:
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          axiom-audit: true
        env:
          LEAN_NUM_THREADS: 1

  python:
    name: Python tests and bounded search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m Discovery.dimensional_search --check
      - run: python -m Discovery.inverse_square_search --check
      - run: python -m Discovery.dependency_analysis --check
      - run: python -m Discovery.physical_bridge --check
      - run: python -m Discovery.published_data_pilot --check
      - run: python -m Discovery.falsification_preregistration --check
      - run: python -m Discovery.null_experiments --check
      - run: python -m Discovery.mutation_harness --check
      - run: python -m Discovery.pydimension_comparison --check
      - run: python -m Discovery.pysr_leakage_check_v2 --check
      - run: python -m Discovery.pysr_leakage_mutations --check
      - run: python -m Discovery.pysr_leakage_hardening --check
      - run: python -m Discovery.pysr_leakage_hardening_mutations --check

  closure:
    name: Materialize final post-audit closure
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/post-audit-closure-rmp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/post-audit-closure-rmp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply bounded patch
        run: python Discovery/_post_audit_closure_runner.py
      - name: Focused tests
        run: |
          python -m unittest tests.test_physical_bridge_source_identifier_hardening -v
          python -m unittest tests.test_physical_bridge.PhysicalBridgeTests.test_populated_empirical_calibration_requires_documented_provenance tests.test_physical_bridge.PhysicalBridgeTests.test_each_empirical_source_metadata_field_is_required -v
          python -m Discovery.physical_bridge --check
      - name: Commit exact source anchor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post_audit_closure.yml Discovery/_post_audit_closure_runner.py
          git add Discovery/physical_bridge_schema.py Discovery/mutation_harness.py tests/test_physical_bridge.py tests/test_mutation_harness.py tests/test_physical_bridge_source_identifier_hardening.py Experiments/GMeasurements/README.md Notes/GMeasurementLiterature.md
          git commit -m "Close post-audit findings and re-anchor schema boundary"
          git push origin HEAD:codex/post-audit-closure-rmp
      - name: Generate mutation evidence v2
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          python -m Discovery.mutation_harness --output Experiments/Falsification/milestone_5b_core_v1.mutation_results_v2.json --source-commit-sha "$SOURCE_SHA"
          python -m Discovery.mutation_harness --check
      - name: Restore permanent workflow and commit evidence
        run: |
          git checkout origin/main -- .github/workflows/verify.yml
          git add .github/workflows/verify.yml Experiments/Falsification/milestone_5b_core_v1.mutation_results_v2.json
          git commit -m "Record re-anchored mutation evidence v2"
          git push origin HEAD:codex/post-audit-closure-rmp
