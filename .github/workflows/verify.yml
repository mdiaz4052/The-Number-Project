name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1.6.0
        with:
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          axiom-audit: true
        env:
          LEAN_NUM_THREADS: 1

  python:
    name: Python tests and bounded search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m Discovery.dimensional_search --output /tmp/g-candidates.csv
      - run: python -m Discovery.inverse_square_search --check
      - run: python -m Discovery.dependency_analysis --check
