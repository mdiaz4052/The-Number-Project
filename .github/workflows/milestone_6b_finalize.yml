name: Milestone 6B finalize evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  RAW_ARTIFACT_ID: "9861736005"
  RESULT_ARTIFACT_ID: "9861737008"
  MUTATION_ARTIFACT_ID: "9861673360"
  RAW_SHA256: "5dc9ceae6d49a8bfab8f00fc4e0d4ddba8c3a4b31bfe4b0944a65aa4c5cf5176"
  RESULT_SHA256: "ed01adff58bc6b95b1d6281af92b3d97a1f71757da760a36762a2bde8fb654a4"
  MUTATION_SHA256: "44ab9598fe07c56091f7ebd27266e7d89a553aa370c144c2744b858df7e94015"

jobs:
  finalize:
    if: github.head_ref == 'codex/milestone-6b-pysr-leakage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download exact reviewed evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/6b/raw /tmp/6b/result /tmp/6b/mutation
          for spec in \
            "$RAW_ARTIFACT_ID:/tmp/6b/raw.zip" \
            "$RESULT_ARTIFACT_ID:/tmp/6b/result.zip" \
            "$MUTATION_ARTIFACT_ID:/tmp/6b/mutation.zip"
          do
            id="${spec%%:*}"
            dest="${spec#*:}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$dest"
          done
          unzip -q /tmp/6b/raw.zip -d /tmp/6b/raw
          unzip -q /tmp/6b/result.zip -d /tmp/6b/result
          unzip -q /tmp/6b/mutation.zip -d /tmp/6b/mutation
          cp /tmp/6b/raw/milestone_6b_pysr_leakage_v1.external.json \
            Experiments/EcosystemComparison/PySRLeakage/
          cp /tmp/6b/result/milestone_6b_pysr_leakage_v1.result.json \
            Experiments/EcosystemComparison/PySRLeakage/
          cp /tmp/6b/mutation/milestone_6b_pysr_leakage_v1.mutation_results.json \
            Experiments/EcosystemComparison/PySRLeakage/
          echo "$RAW_SHA256  Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.external.json" | sha256sum --check --strict
          echo "$RESULT_SHA256  Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.result.json" | sha256sum --check --strict
          echo "$MUTATION_SHA256  Experiments/EcosystemComparison/PySRLeakage/milestone_6b_pysr_leakage_v1.mutation_results.json" | sha256sum --check --strict

      - name: Finalize permanent CI and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          verify = Path('.github/workflows/verify.yml')
          text = verify.read_text(encoding='utf-8')
          anchor = '      - run: python -m Discovery.pydimension_comparison --check\n'
          replacement = (
              anchor
              + '      - run: python -m Discovery.pysr_leakage_check --check\n'
              + '      - run: python -m Discovery.pysr_leakage_mutations --check\n'
          )
          if 'Discovery.pysr_leakage_check --check' not in text:
              if anchor not in text:
                  raise SystemExit('verify.yml insertion anchor missing')
              text = text.replace(anchor, replacement, 1)
          verify.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          milestone_anchor = (
              'input set. The repository records the missing evidence rather than back-solving it from\n'
              'the published value. No empirical result or replication claim is created.\n'
          )
          milestone_text = (
              '\nMilestone 6B uses a pinned PySR 2.2.0 run on preregistered synthetic controls to test a\n'
              'specific provenance boundary. Its primary methodological result is `BOUNDARY_CONFIRMED`:\n'
              'a candidate can be dimensionally valid and have no registered algebraic path to `G` while\n'
              'still carrying known target information through the data-generation path. All 26 PySR\n'
              'outputs are permanently `target_exposed_candidate` and promotion-ineligible; 17 also fail\n'
              'the project\'s independent dimensional check. This is a software/methodology result, not\n'
              'evidence about gravity or a measurement of `G`.\n'
          )
          if 'Milestone 6B uses a pinned PySR 2.2.0 run' not in text:
              if milestone_anchor not in text:
                  raise SystemExit('README milestone insertion anchor missing')
              text = text.replace(milestone_anchor, milestone_anchor + milestone_text, 1)

          output_anchor = (
              '- `Experiments/Falsification/` records the immutable 5B-core preregistration, complete\n'
              '  provenance-stratified null and planted-control result, and disposable-worktree mutation\n'
              '  result with source and integrity metadata.\n'
          )
          output_text = (
              '- `Experiments/EcosystemComparison/PySRLeakage/` records the frozen 6B preregistration,\n'
              '  deterministic dataset manifest, raw pinned PySR output, independently normalized audit,\n'
              '  and two killed semantic mutations for target-exposure and hidden-generation leakage.\n'
          )
          if '`Experiments/EcosystemComparison/PySRLeakage/` records' not in text:
              if output_anchor not in text:
                  raise SystemExit('README output insertion anchor missing')
              text = text.replace(output_anchor, output_anchor + output_text, 1)

          label_anchor = (
              '| **Conjecture** | A precise proposed relationship for which no proof is currently supplied. |\n'
          )
          label_text = (
              '| **Target-exposed candidate** | A candidate proposed or generated after the target or target-bearing data were available to the generating process. It may motivate a new target-clean preregistered path, but the original candidate is not promotion-eligible. |\n'
          )
          if '**Target-exposed candidate**' not in text:
              if label_anchor not in text:
                  raise SystemExit('README epistemic-label insertion anchor missing')
              text = text.replace(label_anchor, label_anchor + label_text, 1)
          readme.write_text(text, encoding='utf-8')

          experiment = Path('Experiments/EcosystemComparison/PySRLeakage/README.md')
          experiment.write_text('''# Milestone 6B — PySR target-leakage probe

This experiment tests a boundary of the project's provenance machinery using synthetic data only.

The central distinction is between:

1. **candidate origin** — PySR saw the target, so every emitted expression is a `target_exposed_candidate`;
2. **registered algebraic ancestry** — whether exact registered definitions expand an expression to a nonzero power of `G`; and
3. **known synthetic generation ancestry** — whether a predictor was actually generated from the synthetic target in the preregistered data-generation graph.

## Preregistered channels

- `A_clean`: clean negative control. `u_clean` and `r_clean` are generated upstream of `G = u_clean / r_clean`.
- `B_registered_leak`: visible positive control. `m_P = sqrt(hbar * c / G)` uses the existing registered Planck-mass dependency.
- `C_hidden_leak`: hidden calibration-path control. `k_hidden = G * s_hidden`, but `k_hidden` is deliberately registered as atomic.

The primary endpoint is deterministic and does not depend on PySR recovering any planted equation. Channel C asks whether the canonical estimator `k_hidden / s_hidden` is simultaneously dimensionally valid, free of a registered algebraic target path, and known by construction to contain target information through the generation graph.

## Result

The primary methodological endpoint is **`BOUNDARY_CONFIRMED`**. The Channel C canonical control is dimensionally valid, has `no_registered_target_path`, and has known target ancestry in the synthetic generation graph. This demonstrates the intended limitation: registered algebraic dependency tracing cannot by itself establish calibration, statistical, experimental, causal, or physical independence.

The frozen PySR experiment used three channels and seeds `0`, `1`, and `2`, producing 26 finite candidate rows. The independent project audit classified:

- 9 dimensionally valid and 17 dimensionally invalid candidates;
- 20 normalized monomials and 6 representational gaps;
- 4 candidates with registered target paths;
- 16 candidates using predictors with known target-generation leakage; and
- 6 candidates in the hidden-target-leakage blind spot.

PySR recovered the canonical signature in `A_clean` and `C_hidden_leak`, but not in `B_registered_leak`. Failure to recover the planted B relation was permitted by the preregistration and was not followed by search-budget or operator tuning.

In Channel C, each seed emitted both `k_hidden` and `k_hidden / s_hidden`. All six are dimensionally valid and have no registered algebraic target path, while their referenced `k_hidden` predictor is known by construction to have been generated downstream of the target. Those six records therefore instantiate the primary blind spot directly.

## Candidate-origin rule

Every expression emitted by PySR is permanently labeled `target_exposed_candidate` because the fitting engine had access to the target. Such a candidate is never promotion-eligible. It may motivate a new target-clean preregistered investigation, but the original record cannot be relabeled into stronger evidence.

Two selected semantic mutations were run in the project's existing disposable-worktree harness. A mutant that bypassed the target-exposed promotion valve was killed. A mutant that collapsed generation-DAG leakage into the registered algebraic result, erasing the Channel C distinction, was also killed.

## External source and reproducibility pins

The external search is pinned to PySR 2.2.0 commit `65b887aeaf97f1c5ae84b0ceffb370551e57ce90`. The run resolved SymbolicRegression.jl 2.2.0 on Julia 1.11.9 and records the complete resolved Julia manifest inside the raw external artifact. The permanent project checker does not import PySR and ordinary CI does not rerun symbolic regression.

Evidence hashes:

- raw external artifact: `5dc9ceae6d49a8bfab8f00fc4e0d4ddba8c3a4b31bfe4b0944a65aa4c5cf5176`;
- normalized project result: `ed01adff58bc6b95b1d6281af92b3d97a1f71757da760a36762a2bde8fb654a4`;
- selected mutation evidence: `44ab9598fe07c56091f7ebd27266e7d89a553aa370c144c2744b858df7e94015`.

The preregistration was committed at `a3cc025bf41670e37b1f85583205156eea1db2b0` before result-sensitive fitting. Search-driving project source was frozen at `f2c26da24cfa5a463dc2bbadeb83c6bf41cc4689`. The normalized result records corrected audit-source commit `201a65f44ac316ae9e0f48235a73f99498848ded`; the selected mutation artifact records source anchor `182e2f3e6129f3a1ffff4890437b8e56119c6575`.

## Execution note

The first frozen PySR search completed and emitted 26 candidates, but the initial normalization step failed on a constant-only expression. Numeric constants were already permitted by the preregistered grammar; the adapter incorrectly passed an empty exponent signature into an older helper that rejects empty signatures. The correction explicitly handles constant-only monomials as dimensionless expressions with no registered target path and adds a regression test. No dataset, seed, operator, unit setting, search budget, or acceptance criterion was changed after observing the output.

The corrected run also uploads raw external evidence before normalization, so a future project-side audit failure cannot discard the external search record. The temporary external-search and mutation workflows are not part of the final review branch; only deterministic permanent checkers remain in ordinary CI.

## Nonclaims

This is not a measurement of `G`, not evidence for gravity, and not independent confirmation of any PySR expression. PySR's dimensional penalty is not a project acceptance rule. Repeated recovery across seeds does not remove target exposure. The synthetic generation graph is known by construction and is not a general causal-inference method. The two killed mutants do not establish that the 6B machinery is defect-free.
''', encoding='utf-8')

          for path in (
              Path('.github/workflows/milestone_6b_external.yml'),
              Path('.github/workflows/milestone_6b_mutations.yml'),
              Path('.github/workflows/milestone_6b_finalize.yml'),
          ):
              if path.exists():
                  path.unlink()
          PY

      - name: Validate final evidence package before commit
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m Discovery.pysr_leakage_check --check
          python -m Discovery.pysr_leakage_mutations --check
          git diff --check

      - name: Commit finalized evidence package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finalize Milestone 6B evidence and guards"
          git push origin HEAD:codex/milestone-6b-pysr-leakage
