name: Temporary HUST audit finalizer

on:
  push:
    branches: [codex/hust-2018-aaf-source-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test classifier before artifact generation
        run: python -m unittest discover -s tests -p 'test_hust_2018_aaf_source_audit.py' -v
      - name: Generate deterministic audit manifest
        run: python -m Discovery.hust_2018_aaf_source_audit
      - name: Commit manifest locally and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Experiments/GMeasurements/hust_2018_aaf_source_audit_v1.manifest.json
          git rm .github/workflows/hust-audit-finalize.yml
          git commit -m 'Finalize HUST 2018 AAF source audit manifest'
          test -z "$(git status --porcelain)"
      - name: Verify clean committed artifact and full Python suite
        run: |
          python -m Discovery.hust_2018_aaf_source_audit --check
          python -m unittest discover -s tests -v
      - name: Push only after clean verification
        run: git push
