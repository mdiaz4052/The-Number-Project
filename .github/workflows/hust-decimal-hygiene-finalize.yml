name: HUST Decimal Hygiene Finalizer

on:
  push:
    branches:
      - codex/post-pr29-decimal-hygiene

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/codex/post-pr29-decimal-hygiene' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply the reviewed Decimal-context hygiene fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Discovery/hust_2018_aaf_measurement_models.py')
          text = path.read_text(encoding='utf-8')

          old = '''    published_u = _published_uncertainty(comparison, scope)\n    comparison_delta = g_hat - published_g\n'''
          new = '''    published_u = _published_uncertainty(comparison, scope)\n    with localcontext() as context:\n        context.prec = 50\n        comparison_delta = g_hat - published_g\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one comparison_delta construction site')
          text = text.replace(old, new)

          old = '''    if comparison_delta != target.value - published_g:\n        raise HUSTMeasurementModelError("terminal published-G comparison value is inconsistent")\n'''
          new = '''    with localcontext() as context:\n        context.prec = 50\n        expected_comparison_delta = target.value - published_g\n    if comparison_delta != expected_comparison_delta:\n        raise HUSTMeasurementModelError("terminal published-G comparison value is inconsistent")\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one comparison_delta validation site')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate the deterministic HUST MeasurementModel artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from Discovery.hust_2018_aaf_measurement_models import DEFAULT_OUTPUT, build_artifact, serialize_artifact

          Path(DEFAULT_OUTPUT).write_text(serialize_artifact(build_artifact()), encoding='utf-8')
          PY

      - name: Commit the hygiene result locally to restore a clean canonical checkout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Discovery/hust_2018_aaf_measurement_models.py Experiments/GMeasurements/hust_2018_aaf_measurement_models_v1.json
          git commit -m 'Keep HUST comparison diagnostic at Decimal precision 50'

      - name: Verify the clean scientific state while the guarded write workflow is still present
        run: |
          test -z "$(git status --porcelain)"
          python -m unittest discover -s tests -v
          python -m Discovery.hust_2018_aaf_source_audit --check
          python -m Discovery.hust_2018_aaf_measurement_models --check
          python -m Discovery.physical_bridge --check
          python -m Discovery.mutation_harness --check

      - name: Remove staging workflow, commit its removal, and push both reviewed commits
        run: |
          git rm .github/workflows/hust-decimal-hygiene-finalize.yml
          git commit -m 'Remove HUST Decimal hygiene finalizer'
          git push origin HEAD:codex/post-pr29-decimal-hygiene
